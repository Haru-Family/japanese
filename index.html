<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>일본어 카나 어드벤처 - 히라가나 & 가타카나 마스터</title>
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap');
    
    * {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f0fdf4;
    }
    .font-game {
      font-family: 'Jua', cursive, sans-serif;
    }
    .font-kana {
      font-family: 'Noto Sans JP', sans-serif;
    }
    .pixel-art {
      image-rendering: pixelated;
    }
    /* 캔버스 드로잉 영역 터치 간섭 완전 방지 */
    #drawCanvas {
      touch-action: none !important;
      cursor: crosshair;
    }
    .shake {
      animation: shake 0.4s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .bounce-in {
      animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes bounceIn {
      0% { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    /* 가로 스크롤바 커스텀 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen pb-20 text-slate-800 bg-gradient-to-b from-sky-50 via-amber-50 to-emerald-50">

  <!-- 상단 네비게이션 헤더 -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b-4 border-amber-400 shadow-sm px-4 py-2.5 max-w-2xl mx-auto flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-3xl">⚡</span>
      <div>
        <h1 class="font-game text-xl md:text-2xl text-amber-600 tracking-wide leading-tight">카나 어드벤처</h1>
        <p class="text-[11px] text-slate-500 font-bold">초보자 일본어 마스터</p>
      </div>
    </div>
    
    <!-- 트레이너 레벨 및 경험치 -->
    <div class="flex items-center gap-3">
      <div class="text-right">
        <div class="flex items-center gap-1 justify-end font-game text-sm text-indigo-700">
          <span>Lv.<span id="trainerLevel">1</span></span>
          <span class="text-xs text-amber-500 font-bold" id="trainerTitle">초보 트레이너</span>
        </div>
        <div class="w-24 md:w-32 bg-slate-200 h-2.5 rounded-full overflow-hidden border border-slate-300">
          <div id="trainerExpBar" class="bg-gradient-to-r from-amber-400 to-amber-500 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
      <button onclick="toggleAudioMute()" id="soundToggleBtn" class="p-2 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-800 transition">
        <i data-lucide="volume-2" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <main class="max-w-2xl mx-auto p-4 space-y-4">

    <!-- 1. 히라가나 / 가타카나 선택 대형 토글 -->
    <div class="bg-white p-2 rounded-2xl shadow-md border-2 border-slate-200 flex gap-2">
      <button onclick="switchKanaMode('hiragana')" id="btnTabHira" class="flex-1 py-3 rounded-xl font-game text-lg md:text-xl flex items-center justify-center gap-2 transition bg-gradient-to-r from-red-500 to-rose-500 text-white shadow-md">
        <span class="font-kana text-2xl font-black">あ</span>
        <span>히라가나 모드</span>
      </button>
      <button onclick="switchKanaMode('katakana')" id="btnTabKata" class="flex-1 py-3 rounded-xl font-game text-lg md:text-xl flex items-center justify-center gap-2 transition bg-slate-100 hover:bg-slate-200 text-slate-600">
        <span class="font-kana text-2xl font-black">ア</span>
        <span>가타카나 모드</span>
      </button>
    </div>

    <!-- 2. 모드 탭 전환 버튼 바 -->
    <nav class="grid grid-cols-4 gap-1.5 p-1 bg-amber-200/60 rounded-2xl border-2 border-amber-300">
      <button onclick="selectMode('step')" id="nav-step" class="mode-btn py-2 px-1 rounded-xl font-game text-sm flex flex-col items-center gap-0.5 bg-white text-amber-700 shadow-sm transition">
        <span class="text-lg">🎯</span>
        <span>5글자 코스</span>
      </button>
      <button onclick="selectMode('write')" id="nav-write" class="mode-btn py-2 px-1 rounded-xl font-game text-sm flex flex-col items-center gap-0.5 text-slate-600 hover:bg-white/50 transition">
        <span class="text-lg">✏️</span>
        <span>쓰기 훈련</span>
      </button>
      <button onclick="selectMode('battle')" id="nav-battle" class="mode-btn py-2 px-1 rounded-xl font-game text-sm flex flex-col items-center gap-0.5 text-slate-600 hover:bg-white/50 transition">
        <span class="text-lg">⚔️</span>
        <span>몬스터 배틀</span>
      </button>
      <button onclick="selectMode('chart')" id="nav-chart" class="mode-btn py-2 px-1 rounded-xl font-game text-sm flex flex-col items-center gap-0.5 text-slate-600 hover:bg-white/50 transition">
        <span class="text-lg">📜</span>
        <span>50음도표</span>
      </button>
    </nav>

    <!-- [MODE 1: 5글자 스텝 코스 (핵심)] -->
    <section id="mode-step-content" class="space-y-4">
      
      <!-- 행 선택 바 (가로 스크롤 가능) -->
      <div class="bg-white p-3 rounded-2xl border-2 border-amber-200 shadow-sm">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-slate-500 uppercase flex items-center gap-1">
            <i data-lucide="layers" class="w-3.5 h-3.5"></i> 학습할 행(5글자 세트) 선택
          </span>
          <span class="text-xs font-bold text-amber-600 font-game" id="currentGroupLabel">あ행 (a, i, u, e, o)</span>
        </div>
        <div class="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar" id="groupSelectorBar">
          <!-- JS로 あ, か, さ, た, な, は, ま, や, ら, わ 행 버튼 자동 생성 -->
        </div>
      </div>

      <!-- 5글자 상세 카드 뷰 -->
      <div class="bg-white rounded-3xl p-5 border-4 border-amber-300 shadow-lg text-center relative overflow-hidden">
        <div class="absolute top-3 left-4 text-xs font-bold px-2.5 py-1 bg-amber-100 text-amber-800 rounded-full font-game" id="stepProgressTag">
          1 / 5 번째 글자
        </div>
        <button onclick="playCurrentKanaVoice()" class="absolute top-3 right-4 p-2.5 rounded-full bg-indigo-50 hover:bg-indigo-100 text-indigo-600 transition shadow-sm active:scale-95" title="원어민 발음 듣기">
          <i data-lucide="volume-2" class="w-6 h-6"></i>
        </button>

        <div class="my-4">
          <div id="stepKanaChar" class="font-kana font-black text-8xl md:text-9xl text-slate-800 tracking-wider transition-all duration-200 cursor-pointer" onclick="playCurrentKanaVoice()">
            あ
          </div>
          <div class="mt-2 flex items-center justify-center gap-2">
            <span id="stepKanaRomaji" class="font-game text-3xl text-amber-600 font-bold">a</span>
            <span id="stepKanaKorean" class="text-xl text-slate-600 font-bold bg-slate-100 px-3 py-0.5 rounded-lg">[아]</span>
          </div>
        </div>

        <!-- 연관 단어 예시 -->
        <div class="bg-amber-50/80 rounded-2xl p-3 border border-amber-200 max-w-sm mx-auto flex items-center justify-center gap-3">
          <span id="stepWordIcon" class="text-2xl">🌧️</span>
          <div class="text-left">
            <div class="font-bold text-slate-700">
              <span id="stepWordKana" class="font-kana text-lg text-indigo-600 font-black">あめ</span>
              <span id="stepWordReading" class="text-xs text-slate-500 font-normal">(아메)</span>
            </div>
            <div id="stepWordMeaning" class="text-xs text-slate-600 font-medium">비, 사탕</div>
          </div>
        </div>

        <!-- 이전/다음 5글자 이동 버튼 -->
        <div class="flex gap-2 mt-6">
          <button onclick="prevStepChar()" id="btnPrevChar" class="flex-1 py-3 rounded-xl font-game text-base bg-slate-100 hover:bg-slate-200 text-slate-600 transition disabled:opacity-40">
            ◀ 이전 글자
          </button>
          <button onclick="nextStepChar()" id="btnNextChar" class="flex-1 py-3 rounded-xl font-game text-base bg-amber-500 hover:bg-amber-600 text-white shadow-md transition flex items-center justify-center gap-1">
            <span>다음 글자</span> ▶
          </button>
        </div>
      </div>

      <!-- 행 마스터 3문제 미니 퀴즈 박스 -->
      <div class="bg-indigo-900 text-white rounded-3xl p-5 border-4 border-indigo-700 shadow-md">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <span class="text-xl">🎯</span>
            <h3 class="font-game text-lg text-amber-300">이 행 마스터 미니 퀴즈</h3>
          </div>
          <span class="text-xs bg-indigo-800 text-indigo-200 px-2.5 py-1 rounded-full font-bold" id="miniQuizScoreTag">퀴즈 준비 완료</span>
        </div>
        <p class="text-xs text-indigo-200 mb-4">현재 행의 5글자를 잘 외웠는지 퀴즈로 확인해 보세요!</p>

        <div id="miniQuizContainer">
          <div class="bg-white/10 rounded-2xl p-4 text-center mb-3">
            <p class="text-xs text-indigo-300 font-bold mb-1">다음 글자의 올바른 소리는?</p>
            <div id="miniQuizQuestionChar" class="font-kana font-black text-6xl text-amber-300 my-2">あ</div>
          </div>
          <div id="miniQuizOptions" class="grid grid-cols-2 gap-2">
            <!-- 퀴즈 4지선다 동적 생성 -->
          </div>
        </div>

        <!-- 다음 행으로 바로 가기 배너 (행 마스터 후 활성화) -->
        <div id="nextGroupJumpBox" class="mt-4 pt-3 border-t border-indigo-800 hidden">
          <button onclick="goToNextGroup()" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-game text-lg rounded-2xl shadow-lg flex items-center justify-center gap-2 transition animate-bounce">
            <span id="nextGroupJumpLabel">か행 배우러 가기</span>
            <i data-lucide="arrow-right" class="w-5 h-5"></i>
          </button>
        </div>
      </div>
    </section>

    <!-- [MODE 2: 글자 쓰기 훈련 (포인터 이벤트 완벽 지원)] -->
    <section id="mode-write-content" class="hidden space-y-4">
      <div class="bg-white rounded-3xl p-5 border-4 border-amber-300 shadow-lg text-center">
        
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <button onclick="prevWriteChar()" class="p-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700">
              <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>
            <span class="font-game text-lg text-slate-700">
              <span id="writeCharDisplay" class="font-kana text-amber-600 font-bold text-2xl">あ</span> 
              (<span id="writeReadingDisplay">a / 아</span>)
            </span>
            <button onclick="nextWriteChar()" class="p-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700">
              <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
          </div>
          <button onclick="playWriteVoice()" class="p-2 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-800">
            <i data-lucide="volume-2" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- 캔버스 드로잉 영역 -->
        <div class="relative w-[300px] h-[300px] mx-auto my-3 bg-amber-50/40 rounded-2xl border-4 border-dashed border-amber-300 overflow-hidden shadow-inner flex items-center justify-center">
          
          <!-- 십자 가이드 점선 -->
          <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
            <div class="w-full h-[1px] bg-amber-200"></div>
          </div>
          <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
            <div class="h-full w-[1px] bg-amber-200"></div>
          </div>

          <!-- 밑그림 글자 (가이드) -->
          <div id="writeGuideChar" class="absolute inset-0 flex items-center justify-center font-kana font-black text-[210px] text-slate-200 pointer-events-none select-none">
            あ
          </div>

          <!-- 실제 그리는 캔버스 -->
          <canvas id="drawCanvas" width="300" height="300" class="absolute inset-0 w-full h-full z-10"></canvas>
        </div>

        <!-- 쓰기 도구 버튼들 -->
        <div class="flex items-center justify-center gap-2 max-w-sm mx-auto">
          <button onclick="toggleGuide()" id="btnToggleGuide" class="flex-1 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center gap-1 transition">
            <i data-lucide="eye" class="w-4 h-4"></i>
            <span>가이드 On/Off</span>
          </button>
          <button onclick="clearCanvas()" class="flex-1 py-2.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-xs flex items-center justify-center gap-1 transition">
            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            <span>지우기</span>
          </button>
          <button onclick="verifyWriting()" class="flex-1 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-game text-sm flex items-center justify-center gap-1 shadow-md transition">
            <i data-lucide="check-circle" class="w-4 h-4"></i>
            <span>완성 평가</span>
          </button>
        </div>
      </div>
    </section>

    <!-- [MODE 3: 몬스터 배틀 퀴즈] -->
    <section id="mode-battle-content" class="hidden space-y-4">
      <div class="bg-gradient-to-b from-indigo-950 via-slate-900 to-indigo-900 text-white rounded-3xl p-5 border-4 border-amber-400 shadow-xl relative overflow-hidden">
        
        <!-- 스테이지 및 몬스터 정보 -->
        <div class="flex justify-between items-center mb-3">
          <span class="font-game text-xs text-amber-300 bg-amber-950/80 border border-amber-700 px-3 py-1 rounded-full">
            STAGE <span id="battleStage">1</span>
          </span>
          <div class="flex items-center gap-1 text-xs font-bold text-rose-300">
            <span>연속 정답:</span>
            <span id="battleStreak" class="font-game text-base text-amber-400">0</span>콤보!
          </div>
        </div>

        <!-- 몬스터 배틀 필드 -->
        <div class="relative py-4 text-center">
          <!-- 몬스터 체력 바 -->
          <div class="max-w-xs mx-auto mb-2 bg-slate-800 rounded-full h-3 p-0.5 border border-slate-600">
            <div id="monsterHpBar" class="bg-gradient-to-r from-rose-500 to-red-500 h-full rounded-full transition-all duration-300" style="width: 100%"></div>
          </div>
          <div class="text-[11px] text-slate-300 font-bold mb-2">
            <span id="monsterName">슬라임 피카</span> HP <span id="monsterHpText">100/100</span>
          </div>

          <!-- 몬스터 캐릭터 아이콘 -->
          <div id="monsterAvatar" class="text-7xl my-2 inline-block transition-transform duration-200">
            👾
          </div>
        </div>

        <!-- 배틀 퀴즈 질문 -->
        <div class="bg-white/10 backdrop-blur rounded-2xl p-4 text-center mb-4 border border-white/10">
          <div class="text-xs text-amber-300 font-bold mb-1" id="battleQuestionPrompt">이 글자의 소리는 무엇일까요?</div>
          <div id="battleQuestionChar" class="font-kana font-black text-7xl text-amber-300 my-2">あ</div>
        </div>

        <!-- 4지선다 버튼 -->
        <div id="battleChoicesGrid" class="grid grid-cols-2 gap-2.5">
          <!-- JS로 동적 생성 -->
        </div>
      </div>
    </section>

    <!-- [MODE 4: 50음도표 전체 뷰] -->
    <section id="mode-chart-content" class="hidden space-y-3">
      <div class="bg-white p-4 rounded-3xl border-4 border-amber-200 shadow-md">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <span class="text-2xl">📜</span>
            <h3 class="font-game text-lg text-slate-800">50음도표 전체보기</h3>
          </div>
          <p class="text-xs text-slate-400">글자를 누르면 발음 청취</p>
        </div>
        
        <!-- 50음도 그리드 -->
        <div id="fullChartGrid" class="grid grid-cols-5 gap-2 text-center">
          <!-- JS로 50개 카드 자동 생성 -->
        </div>
      </div>
    </section>

  </main>

  <script>
    /* =========================================================
       1. 일본어 기본 데이터 (50음도 및 예시 단어)
       ========================================================= */
    const KANA_GROUPS = [
      {
        id: 'a',
        name: 'あ행 (아이우에오)',
        chars: [
          { hira: 'あ', kata: 'ア', romaji: 'a', ko: '아', word: 'あめ', wordKo: '비 / 사탕', icon: '🍬' },
          { hira: 'い', kata: 'イ', romaji: 'i', ko: '이', word: 'いぬ', wordKo: '개 (강아지)', icon: '🐶' },
          { hira: 'う', kata: 'う', romaji: 'u', ko: '우', word: 'うみ', wordKo: '바다', icon: '🌊' },
          { hira: 'え', kata: 'エ', romaji: 'e', ko: '에', word: 'えき', wordKo: '기차역', icon: '🚉' },
          { hira: 'お', kata: 'オ', romaji: 'o', ko: '오', word: 'おに', wordKo: '도깨비', icon: '👹' }
        ]
      },
      {
        id: 'ka',
        name: 'か행 (카키쿠케코)',
        chars: [
          { hira: 'か', kata: 'カ', romaji: 'ka', ko: '카', word: 'かさ', wordKo: '우산', icon: '☂️' },
          { hira: 'き', kata: 'キ', romaji: 'ki', ko: '키', word: 'き', wordKo: '나무', icon: '🌳' },
          { hira: 'く', kata: 'ク', romaji: 'ku', ko: '쿠', word: 'くるま', wordKo: '자동차', icon: '🚗' },
          { hira: 'け', kata: 'ケ', romaji: 'ke', ko: '케', word: 'けいさつ', wordKo: '경찰', icon: '👮' },
          { hira: 'こ', kata: 'コ', romaji: 'ko', ko: '코', word: 'こども', wordKo: '어린이', icon: '🧒' }
        ]
      },
      {
        id: 'sa',
        name: 'さ행 (사시스세소)',
        chars: [
          { hira: 'さ', kata: 'サ', romaji: 'sa', ko: '사', word: 'さくら', wordKo: '벚꽃', icon: '🌸' },
          { hira: 'し', kata: 'シ', romaji: 'shi', ko: '시', word: 'しま', wordKo: '섬', icon: '🏝️' },
          { hira: 'す', kata: 'ス', romaji: 'su', ko: '스', word: 'すし', wordKo: '초밥', icon: '🍣' },
          { hira: 'せ', kata: 'セ', romaji: 'se', ko: '세', word: 'せんせい', wordKo: '선생님', icon: '👩‍🏫' },
          { hira: 'そ', kata: 'ソ', romaji: 'so', ko: '소', word: 'そら', wordKo: '하늘', icon: '☁️' }
        ]
      },
      {
        id: 'ta',
        name: 'た행 (타치츠테토)',
        chars: [
          { hira: 'た', kata: 'タ', romaji: 'ta', ko: '타', word: 'たまご', wordKo: '달걀', icon: '🥚' },
          { hira: 'ち', kata: 'チ', romaji: 'chi', ko: '치', word: 'ちず', wordKo: '지도', icon: '🗺️' },
          { hira: 'つ', kata: 'ツ', romaji: 'tsu', ko: '츠', word: 'つき', wordKo: '달', icon: '🌙' },
          { hira: 'て', kata: 'テ', romaji: 'te', ko: '테', word: 'て', wordKo: '손', icon: '✋' },
          { hira: 'と', kata: 'ト', romaji: 'to', ko: '토', word: 'とり', wordKo: '새', icon: '🐦' }
        ]
      },
      {
        id: 'na',
        name: 'な행 (나니누네노)',
        chars: [

    /* =========================================================
       3. Web Audio & Speech TTS 발음
       ========================================================= */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep(freq, type = 'sine', duration = 0.15) {
      if (!soundEnabled) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playSoundCorrect() {
      playBeep(523.25, 'triangle', 0.1);
      setTimeout(() => playBeep(659.25, 'triangle', 0.15), 100);
      setTimeout(() => playBeep(783.99, 'triangle', 0.25), 200);
    }

    function playSoundWrong() {
      playBeep(220, 'sawtooth', 0.2);
      setTimeout(() => playBeep(180, 'sawtooth', 0.3), 150);
    }

    function speakKana(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ja-JP';
      utter.rate = 0.85;
      window.speechSynthesis.speak(utter);
    }

    function toggleAudioMute() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('soundToggleBtn');

    /* =========================================================
       6. [MODE 1] 5글자 스텝 코스 로직 (행 선택 바 포함)

    function renderGroupSelector() {
      const container = document.getElementById('groupSelectorBar');
      container.innerHTML = '';

      KANA_GROUPS.forEach((group, idx) => {

    /* 행 마스터 3문제 미니 퀴즈 */

    function generateMiniQuizQuestion() {
      const group = KANA_GROUPS[currentGroupIndex];
      const target = group.chars[Math.floor(Math.random() * group.chars.length)];
      miniQuizCurrentQ = target;

      const qChar = currentKanaMode === 'hiragana' ? target.hira : target.kata;

      // 보기 생성 (정답 1개 + 오답 3개)
      let pool = ALL_CHARS.filter(c => c.romaji !== target.romaji);
      pool.sort(() => Math.random() - 0.5);
      let choices = [target, pool[0], pool[1], pool[2]];
      choices.sort(() => Math.random() - 0.5);

      const optionsBox = document.getElementById('miniQuizOptions');
      optionsBox.innerHTML = '';
      choices.forEach(c => {
        const btn = document.createElement('button');
        btn.className = "py-3 px-2 rounded-xl bg-white/20 hover:bg-white/30 text-white font-game text-base border border-white/20 transition active:scale-95";
        btn.textContent = `${c.ko} (${c.romaji})`;
        btn.onclick = () => answerMiniQuiz(c, btn);
        optionsBox.appendChild(btn);

    function answerMiniQuiz(selected, btnEl) {
      if (selected.romaji === miniQuizCurrentQ.romaji) {
        playSoundCorrect();

    /* =========================================================
       7. [MODE 2] 글자 쓰기 훈련 (PointerEvents 지원)
       ========================================================= */
    let canvas, ctx;
    let isDrawing = false;
    let guideVisible = true;

    function initCanvas() {
      canvas = document.getElementById('drawCanvas');
      if (!canvas) return;
      ctx = canvas.getContext('2d');

      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#2563eb';

      // 포인터 이벤트 리스너 등록 (터치/마우스 완전 통합)
      canvas.onpointerdown = startDraw;
      canvas.onpointermove = moveDraw;
      canvas.onpointerup = endDraw;
      canvas.onpointercancel = endDraw;
      
      clearCanvas();
      renderWriteMode();
    }

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }

    function startDraw(e) {
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      isDrawing = true;
      const { x, y } = getCanvasCoords(e);
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    function moveDraw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const { x, y } = getCanvasCoords(e);
      ctx.lineTo(x, y);
      ctx.stroke();
    }

    function endDraw(e) {
      if (!isDrawing) return;
      isDrawing = false;
      ctx.closePath();
    }

    function clearCanvas() {
      if (!ctx) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function toggleGuide() {
      guideVisible = !guideVisible;
      document.getElementById('writeGuideChar').style.display = guideVisible ? 'flex' : 'none';
    }

    function renderWriteMode() {
      const charData = ALL_CHARS[currentWriteIndex];
      const char = currentKanaMode === 'hiragana' ? charData.hira : charData.kata;

      document.getElementById('writeCharDisplay').textContent = char;
      document.getElementById('writeReadingDisplay').textContent = `${charData.romaji} / ${charData.ko}`;
      document.getElementById('writeGuideChar').textContent = char;
      clearCanvas();
    }

    function prevWriteChar() {
      if (currentWriteIndex > 0) {
        currentWriteIndex--;
        renderWriteMode();
      }
    }

    function nextWriteChar() {
      if (currentWriteIndex < ALL_CHARS.length - 1) {
        currentWriteIndex++;
        renderWriteMode();
      }
    }

    function playWriteVoice() {
      const charData = ALL_CHARS[currentWriteIndex];
      const char = currentKanaMode === 'hiragana' ? charData.hira : charData.kata;
      speakKana(char);
    }

    function verifyWriting() {
      // 캔버스에 픽셀이 일정량 이상 채워졌는지 검증
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let drawnPixels = 0;
      for (let i = 3; i < imgData.data.length; i += 4) {
        if (imgData.data[i] > 20) drawnPixels++;
      }

      if (drawnPixels > 400) {
        playSoundCorrect();
        confetti({ particleCount: 40, spread: 50, origin: { y: 0.7 } });
        addExp(15);
        setTimeout(nextWriteChar, 600);
      } else {
        alert('조금 더 글씨를 완성해 보세요! 획을 그어주세요 ✍️');
      }
    }

    /* =========================================================
       8. [MODE 3] 포켓몬 몬스터 배틀 퀴즈
       ========================================================= */
    function newBattleRound() {
      const monster = MONSTERS[(battleStage - 1) % MONSTERS.length];
      document.getElementById('monsterName').textContent = monster.name;
      document.getElementById('monsterAvatar').textContent = monster.avatar;
      monsterMaxHp = monster.hp;
      monsterCurrentHp = monster.hp;
      updateMonsterHpUI();
      nextBattleQuestion();
    }

    function nextBattleQuestion() {
      // 랜덤 글자 선택
      currentBattleChar = ALL_CHARS[Math.floor(Math.random() * ALL_CHARS.length)];
      const char = currentKanaMode === 'hiragana' ? currentBattleChar.hira : currentBattleChar.kata;
      document.getElementById('battleQuestionChar').textContent = char;

      // 4개 선택지 생성
      let pool = ALL_CHARS.filter(c => c.romaji !== currentBattleChar.romaji);
      pool.sort(() => Math.random() - 0.5);
      currentBattleOptions = [currentBattleChar, pool[0], pool[1], pool[2]];
      currentBattleOptions.sort(() => Math.random() - 0.5);

      const grid = document.getElementById('battleChoicesGrid');
      grid.innerHTML = '';
      currentBattleOptions.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "py-4 px-3 rounded-2xl bg-white/10 hover:bg-white/20 border-2 border-white/20 text-white font-game text-lg transition active:scale-95";
        btn.textContent = `${opt.ko} (${opt.romaji})`;
        btn.onclick = () => handleBattleAnswer(opt, btn);
        grid.appendChild(btn);
      });
    }

    function handleBattleAnswer(selected, btnEl) {
      if (selected.romaji === currentBattleChar.romaji) {
        playSoundCorrect();
        battleStreak++;
        document.getElementById('battleStreak').textContent = battleStreak;
        
        // 몬스터 데미지 타격
        const damage = 35 + (battleStreak * 5);
        monsterCurrentHp = Math.max(0, monsterCurrentHp - damage);
        updateMonsterHpUI();

        // 몬스터 타격 흔들림 연출
        const monEl = document.getElementById('monsterAvatar');
        monEl.classList.add('shake');
        setTimeout(() => monEl.classList.remove('shake'), 400);

        addExp(10);

        if (monsterCurrentHp <= 0) {
          // 몬스터 처치! 다음 스테이지
          setTimeout(() => {
            confetti({ particleCount: 80, spread: 70 });
            battleStage++;
            document.getElementById('battleStage').textContent = battleStage;
            newBattleRound();
          }, 500);
        } else {
          setTimeout(nextBattleQuestion, 450);
        }
      } else {
        playSoundWrong();
        battleStreak = 0;
        document.getElementById('battleStreak').textContent = battleStreak;
        btnEl.classList.add('bg-rose-600', 'shake');
      }
    }

    function updateMonsterHpUI() {
      const pct = (monsterCurrentHp / monsterMaxHp) * 100;
      document.getElementById('monsterHpBar').style.width = pct + '%';
      document.getElementById('monsterHpText').textContent = `${monsterCurrentHp}/${monsterMaxHp}`;
    }

    /* =========================================================
       9. [MODE 4] 50음도표 전체보기
       ========================================================= */
    function renderChart() {
      const grid = document.getElementById('fullChartGrid');
      grid.innerHTML = '';

      ALL_CHARS.forEach(item => {
        const char = currentKanaMode === 'hiragana' ? item.hira : item.kata;
        const card = document.createElement('div');
        card.className = "bg-amber-50/60 hover:bg-amber-100 p-2.5 rounded-2xl border border-amber-200 cursor-pointer transition active:scale-95 flex flex-col items-center justify-center";
        card.innerHTML = `
          <div class="font-kana font-black text-2xl text-slate-800">${char}</div>
          <div class="text-[11px] text-amber-700 font-bold font-game mt-0.5">${item.ko}</div>
          <div class="text-[9px] text-slate-400 uppercase">${item.romaji}</div>
        `;
        card.onclick = () => {
          speakKana(char);
          card.classList.add('bg-amber-200');
          setTimeout(() => card.classList.remove('bg-amber-200'), 200);
        };
        grid.appendChild(card);
      });
    }

    /* =========================================================
       초기화 실행
       ========================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      updateTrainerUI();
      renderGroupSelector();
      renderStepMode();
      initMiniQuiz();
      renderChart();
      newBattleRound();
    });
  </script>
</body>
</html>
